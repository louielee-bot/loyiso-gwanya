<script>
(function() {
  try { window.parent.postMessage({ type: 'zo-site-loaded' }, '*'); } catch(e) {}

  var _lastPath = '';
  function reportPath() {
    var p = location.pathname + location.search + location.hash;
    if (p !== _lastPath) {
      _lastPath = p;
      try { window.parent.postMessage({ type: 'zo-site-navigate', path: p }, '*'); } catch(e) {}
    }
  }
  reportPath();
  var _origPush = history.pushState;
  var _origReplace = history.replaceState;
  history.pushState = function() { _origPush.apply(this, arguments); reportPath(); };
  history.replaceState = function() { _origReplace.apply(this, arguments); reportPath(); };
  window.addEventListener('popstate', reportPath);

  const originalConsole = {
    log: console.log,
    error: console.error,
    warn: console.warn,
    info: console.info,
    debug: console.debug
  };

  function sendLog(level, args) {
    try {
      const message = args.map(arg => {
        if (typeof arg === 'string') return arg;
        if (arg instanceof Error) return arg.message;
        try { return JSON.stringify(arg); } catch { return String(arg); }
      }).join(' ');

      let stack = undefined;
      if (level === 'error') {
        for (const arg of args) {
          if (arg instanceof Error && arg.stack) {
            stack = arg.stack;
            break;
          }
        }
      }

      fetch('/__zo_log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          level,
          message,
          timestamp: new Date().toISOString(),
          url: window.location.href,
          stack
        })
      }).catch(() => {});
    } catch {}
  }

  ['log', 'error', 'warn', 'info', 'debug'].forEach(level => {
    console[level] = function(...args) {
      originalConsole[level].apply(console, args);
      sendLog(level, args);
    };
  });

  window.addEventListener('error', (e) => {
    sendLog('error', [e.error || e.message]);
  });

  window.addEventListener('unhandledrejection', (e) => {
    sendLog('error', [e.reason || 'Unhandled promise rejection']);
  });
})();
